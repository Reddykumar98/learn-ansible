- name: print facts
  hosts: local
  connection: local
  tasks:
  - name: print the facts
    debug:
      msg: "{{ ansible_facts }}"
  - name: print some info
    debug:
      msg: |
        "OsFamily: {{ ansible_facts['os_family'] }}"
        "privateip : {{ ansible_facts.default_ipv4.address }}
         "privateip : {{ ansible_facts['default_ipv4']['address'] }}