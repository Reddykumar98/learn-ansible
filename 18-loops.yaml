- name: install packages
  hosts: local
  connection: local
  become: yes
  vars:
    packages:
    - { name: 'nginx', state: 'present' }
    - { name: 'mysql', state: 'absent' }
    - { name: 'git', state: 'present' }
    - { name: 'htop', state: 'absent' }
  tasks:
  - name: install packages
    package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop: "{{ packages }}"